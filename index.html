<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أسئلة الماراثون</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Cairo",Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top right,rgba(212,175,55,.10),transparent 30%),        
        radial-gradient(circle at bottom left,rgba(255,255,255,.04),transparent 30%),
        linear-gradient(135deg,#050505,#111111,#050505);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.app{
    width:min(1100px,100%);
    min-height:700px;

    background:rgba(18,18,18,.96);

    border:1px solid rgba(212,175,55,.25);

    border-radius:30px;

    box-shadow:
        0 0 40px rgba(0,0,0,.8),
        0 0 80px rgba(212,175,55,.06);

    overflow:hidden;
}


/* =========================
        HEADER
========================= */

.header{
    padding:28px 30px 22px;

    border-bottom:1px solid rgba(255,255,255,.08);
}

.title{
    text-align:center;

    color:#d4af37;

    font-size:clamp(25px,4vw,40px);

    font-weight:900;

    margin-bottom:20px;

    text-shadow:
        0 0 20px rgba(212,175,55,.18);
}


/* =========================
        الأكواد
========================= */

.top-codes{

    display:grid;

    grid-template-columns:1fr;

    gap:12px;

    margin-bottom:22px;
}

.top-code{

    width:100%;

    padding:18px 22px;

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(212,175,55,.10),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(212,175,55,.25);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.top-code span{

    color:#d4af37;

    font-weight:900;

    font-size:18px;
}

.top-code strong{

    color:white;

    font-size:21px;

    direction:ltr;

    letter-spacing:1px;
}


/* =========================
        PROGRESS
========================= */

.progress-container{

    display:flex;

    align-items:center;

    gap:15px;
}

.progress-bar{

    flex:1;

    height:12px;

    background:#272727;

    border-radius:999px;

    overflow:hidden;
}

.progress-fill{

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #8d6e1f,
            #d4af37,
            #f5d76e
        );

    transition:width .35s ease;
}


/* =========================
        CONTENT
========================= */

.content{

    min-height:550px;

    padding:38px;

    display:flex;

    justify-content:center;

    align-items:center;
}


/* =========================
        QUESTION
========================= */

.question-box{

    width:100%;

    max-width:950px;

    animation:questionIn .35s ease;
}

@keyframes questionIn{

    from{

        opacity:0;

        transform:
            translateY(18px)
            scale(.98);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

.question{

    text-align:center;

    font-size:clamp(23px,3vw,35px);

    line-height:1.8;

    font-weight:900;

    margin-bottom:35px;
}


/* =========================
        OPTIONS
========================= */

.options{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}

.option{

    min-height:90px;

    display:flex;

    align-items:center;

    gap:15px;

    padding:17px 20px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.02)
        );

    border:1px solid rgba(255,255,255,.08);

    transition:.25s ease;
}

.option:hover{

    transform:translateY(-4px);

    border-color:
        rgba(212,175,55,.45);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        0 0 20px rgba(212,175,55,.07);
}

.number{

    width:52px;

    height:52px;

    min-width:52px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #d4af37,
            #9e7c20
        );

    color:#111;

    font-size:23px;

    font-weight:900;
}

.option-text{

    font-size:clamp(17px,2vw,22px);

    line-height:1.7;

    font-weight:700;
}


/* =========================
        NEXT BUTTON
========================= */

.navigation{

    margin-top:30px;

    text-align:center;
}

.next-button{

    border:none;

    padding:13px 30px;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #9e7c20
        );

    color:#111;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 24px rgba(212,175,55,.18);

    transition:.25s ease;
}

.next-button:hover{

    transform:translateY(-3px);
}


/* =========================
        START SCREEN
========================= */

.start-screen{

    width:100%;

    max-width:950px;

    text-align:center;

    animation:questionIn .4s ease;
}

.start-button{

    width:100%;

    border:none;

    padding:18px 30px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #d4af37,
            #9e7c20
        );

    color:#111;

    font-size:23px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(212,175,55,.20);

    transition:.25s ease;
}

.start-button:hover{

    transform:
        translateY(-4px)
        scale(1.01);

    box-shadow:
        0 15px 35px rgba(212,175,55,.30);
}


/* =========================
        HASH SCREEN
========================= */

.special-screen{

    width:100%;

    text-align:center;

    animation:questionIn .4s ease;
}

.hash-symbol{

    font-size:120px;

    color:#d4af37;

    margin-bottom:20px;

    text-shadow:
        0 0 35px rgba(212,175,55,.18);
}

.special-title{

    color:#d4af37;

    font-size:clamp(32px,5vw,52px);

    font-weight:900;

    margin-bottom:20px;
}

.special-text{

    color:#ddd;

    font-size:clamp(20px,3vw,28px);

    line-height:1.8;

    margin-bottom:30px;
}

.hash-button{

    width:150px;

    height:150px;

    border:none;

    border-radius:35px;

    background:
        linear-gradient(
            145deg,
            #d4af37,
            #9e7c20
        );

    color:#111;

    font-size:72px;

    font-weight:900;

    cursor:pointer;

    transition:.25s ease;
}

.hash-button:hover{

    transform:scale(1.06);
}


/* =========================
        FINISH
========================= */

.finish-screen{

    width:100%;

    text-align:center;

    animation:questionIn .4s ease;
}

.finish-symbol{

    font-size:100px;

    color:#d4af37;

    margin-bottom:20px;
}

.finish-title{

    color:#d4af37;

    font-size:clamp(32px,5vw,52px);

    font-weight:900;

    margin-bottom:20px;
}

.finish-text{

    color:#ddd;

    font-size:clamp(20px,3vw,28px);

    line-height:1.8;
}


/* =========================
        FOOTER
========================= */

.footer{

    text-align:center;

    color:#777;

    padding:
        0
        20px
        25px;

    font-size:14px;
}


/* =========================
        RESPONSIVE
========================= */

@media(max-width:800px){

    .options{

        grid-template-columns:1fr;
    }

    .content{

        padding:25px 18px;
    }
}

@media(max-width:600px){

    .header{

        padding:
            22px
            15px
            18px;
    }

    .top-code{

        padding:
            15px
            16px;
    }

    .top-code span{

        font-size:16px;
    }

    .top-code strong{

        font-size:18px;
    }
}

@media(max-width:520px){

    body{

        padding:10px;
    }

    .content{

        padding:
            20px
            13px;
    }

    .question{

        font-size:23px;
    }

    .option-text{

        font-size:16px;
    }

    .number{

        width:44px;

        height:44px;

        min-width:44px;

        font-size:19px;
    }

    .start-button{

        font-size:20px;

        padding:
            16px
            20px;
    }
}

</style>

</head>

            HEADER

           اسئلة الماراثون

/* =====================================================
                    VARIABLES
===================================================== */

let currentQuestion = 0;

let hashScreen = false;

let hashAfter = 0;


/* =====================================================
                    ELEMENTS
===================================================== */

const content =
    document.getElementById("content");

const progressFill =
    document.getElementById("progressFill");

const progressContainer =
    document.getElementById("progressContainer");


/* =====================================================
                START SCREEN
===================================================== */

function showStartScreen(){

    progressContainer.style.display="none";

    content.innerHTML=`

        <div class="start-screen">

            <button
                class="start-button"
                onclick="startExam()"
            >

                ابدأ الأسئلة

            </button>

        </div>

    `;
}


/* =====================================================
                    START EXAM
===================================================== */

function startExam(){

    currentQuestion=0;

    progressContainer.style.display="flex";

    renderQuestion();
}


/* =====================================================
                UPDATE PROGRESS
===================================================== */

function updateProgress(){

    if(currentQuestion < questions.length){

        progressFill.style.width =
            `${((currentQuestion+1) / questions.length) * 100}%`;

    }else{

        progressFill.style.width="100%";

    }

}


/* =====================================================
                SHOW QUESTION
===================================================== */

function renderQuestion(){

    hashScreen=false;

    updateProgress();


    const question =
        questions[currentQuestion];


    let optionsHTML="";


    question.options.forEach(
        (option,index)=>{

            optionsHTML += `

                <div class="option">

                    <div class="number">

                        ${index+1}

                    </div>

                    <div class="option-text">

                        ${option}

                    </div>

                </div>

            `;

        }
    );


    content.innerHTML=`

        <div class="question-box">

            <div class="question">

                ${question.q}

            </div>


            <div class="options">

                ${optionsHTML}

            </div>


            <div class="navigation">

                <button
                    class="next-button"
                    onclick="nextQuestion()"
                >

                    السؤال التالي

                </button>

            </div>

        </div>

    `;
}


/* =====================================================
                NEXT QUESTION
===================================================== */

function nextQuestion(){

    /* لو وصلنا لآخر سؤال */

    if(currentQuestion >= questions.length-1){

        currentQuestion++;

        showFinishScreen();

        return;

    }


    currentQuestion++;


    /* بعد السؤال 16 */

    if(currentQuestion === 16){

        hashAfter=16;

        showHashScreen();

        return;

    }


    /* بعد السؤال 32 */

    if(currentQuestion === 32){

        hashAfter=32;

        showHashScreen();

        return;

    }


    /* بعد السؤال 48 */

    if(currentQuestion === 48){

        hashAfter=48;

        showHashScreen();

        return;

    }


    renderQuestion();
}


/* =====================================================
                HASH SCREEN
===================================================== */

function showHashScreen(){

    hashScreen=true;


    content.innerHTML=`

        <div class="special-screen">


            <div class="hash-symbol">

                #

            </div>


            <div class="special-title">

                اضغط #

            </div>


            <div class="special-text">

                تم الانتهاء من

                <strong
                    style="color:#d4af37;"
                >

                    ${hashAfter}

                </strong>

                سؤال

                <br>

                اضغط على # للمتابعة

            </div>


            <button
                class="hash-button"
                onclick="continueAfterHash()"
            >

                #

            </button>


        </div>

    `;
}


/* =====================================================
                CONTINUE
===================================================== */

function continueAfterHash(){

    renderQuestion();

}


/* =====================================================
                FINISH
===================================================== */

function showFinishScreen(){

    hashScreen=false;

    updateProgress();


    content.innerHTML=`

        <div class="finish-screen">


            <div class="finish-symbol">

                ✓

            </div>


            <div class="finish-title">

                انتهت الأسئلة

            </div>


            <div class="finish-text">

                تم الانتهاء من جميع أسئلة

                البصخة والقديس أثناسيوس

                <br>
                <br>

                عدد الأسئلة:

                <strong
                    style="color:#d4af37;"
                >

                    60

                </strong>

            </div>


        </div>

    `;
}


/* =====================================================
                KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        /* لو في شاشة # */

        if(
            hashScreen &&
            event.key === "#"
        ){

            continueAfterHash();

            return;

        }


        /* Enter = السؤال التالي */

        if(
            !hashScreen &&
            event.key === "Enter"
        ){

            nextQuestion();

        }

    }
);


/* =====================================================
                INITIAL
===================================================== */

showStartScreen();


</script>
